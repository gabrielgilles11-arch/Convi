# Records the spoken lines and commits them.
#
# It exists because the voice models live on Hugging Face and the machines that
# would otherwise run this can't always reach it — a runner can. Piper needs no
# key and no account, which is the whole point: this path works when nobody has
# signed up for anything.
#
# Run it from the Actions tab. Generating a handful of lines first is worth the
# extra minute — a voice you haven't heard is a voice you don't want 109 of.
name: Generate audio

on:
  workflow_dispatch:
    inputs:
      locale:
        description: "Edition to record"
        type: choice
        options: [sv-SE, es-ES, de-DE]
        default: sv-SE
      voice:
        description: "Piper voice (see huggingface.co/rhasspy/piper-voices)"
        default: sv_SE-nst-medium
      sample:
        description: "Lines to record, or 0 for the whole edition"
        default: "6"
      branch:
        description: "Branch to commit the clips to"
        default: claude/german-beer-ordering-ux-wkmk7s

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Piper and an encoder
        # ffmpeg is what turns Piper's WAV into MP3 — a fifth of the bytes for a
        # line nobody can tell apart. The runner image no longer ships it, and
        # the generator silently keeps the WAV when it is missing, which is how
        # the first run produced 67KB clips.
        run: |
          pip install --quiet piper-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Record
        env:
          LOCALE: ${{ inputs.locale }}
          # Read from the environment rather than interpolated into the command,
          # so a voice name can never become part of the shell line.
          PIPER_SV_MODEL: ${{ inputs.voice }}
          PIPER_ES_MODEL: ${{ inputs.voice }}
          PIPER_DE_MODEL: ${{ inputs.voice }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          set -euo pipefail
          ARGS=(--locale "$LOCALE" --engine piper --force)
          if [ "$SAMPLE" != "0" ]; then ARGS+=(--sample "$SAMPLE"); fi
          node scripts/generate-audio.mjs "${ARGS[@]}"

      - name: What came out
        run: |
          ls -la "public/audio/${{ inputs.locale }}" | head -20
          du -sh "public/audio/${{ inputs.locale }}"

      - name: Commit
        env:
          LOCALE: ${{ inputs.locale }}
          VOICE: ${{ inputs.voice }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          # Nothing to say when the run changed nothing — a re-record with the
          # same voice produces byte-identical files.
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Record $LOCALE with Piper $VOICE

          Generated by .github/workflows/generate-audio.yml."
          git push origin HEAD:"${{ inputs.branch }}"
