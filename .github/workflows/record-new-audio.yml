# Records clips for new lines, on its own, whenever content reaches main.
#
# generate-audio.yml is the manual tool: auditions, whole-edition re-records,
# verification. This is the everyday case: somebody adds a line, and it should
# be spoken in the edition's own voice by the time anybody hears it, without
# anyone remembering to press a button.
#
# Only missing clips are made (no --force), in the provider and voice already
# written in public/audio/<locale>/voice.json, so a deck never ends up in two
# voices. The commit touches only public/audio, which is not in `paths`, and a
# push made with GITHUB_TOKEN starts no workflow, so this cannot loop.
name: Record new audio

on:
  push:
    branches: [main]
    paths:
      - "content/*.json"
      - "src/lib/talkScripts.ts"
      - "src/lib/replyLead.mjs"
      - "scripts/generate-audio.mjs"
  workflow_dispatch: {}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      # One edition's failure (an endpoint down) should not stop the others.
      fail-fast: false
      # One at a time: each run commits and pushes to main.
      max-parallel: 1
      matrix:
        locale: [es-ES, sv-SE, de-DE]
    # Shared with generate-audio.yml, so a manual re-record and this never race.
    concurrency:
      group: audio-${{ matrix.locale }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: What is missing
        id: missing
        env:
          LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          PROVIDER=$(node -p "require('./public/audio/$LOCALE/voice.json').provider")
          VOICE=$(node -p "require('./public/audio/$LOCALE/voice.json').voice")
          SUMMARY=$(node scripts/generate-audio.mjs --locale "$LOCALE" --engine "$PROVIDER" --dry-run | tail -1)
          echo "$SUMMARY"
          COUNT=$(echo "$SUMMARY" | sed -E 's/^([0-9]+) generated.*/\1/')
          {
            echo "provider=$PROVIDER"
            echo "voice=$VOICE"
            echo "count=$COUNT"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.missing.outputs.count != '0'
        with:
          python-version: "3.12"

      - name: Install Edge TTS
        if: steps.missing.outputs.count != '0' && steps.missing.outputs.provider == 'edge'
        # Unpinned on purpose, as in generate-audio.yml.
        run: pip install --quiet --upgrade edge-tts

      - name: Install Piper and an encoder
        if: steps.missing.outputs.count != '0' && steps.missing.outputs.provider == 'piper'
        run: |
          pip install --quiet piper-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Record the missing lines
        if: steps.missing.outputs.count != '0'
        env:
          LOCALE: ${{ matrix.locale }}
          PROVIDER: ${{ steps.missing.outputs.provider }}
          VOICE: ${{ steps.missing.outputs.voice }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          set -euo pipefail
          for name in EDGE_VOICE AZURE_VOICE GOOGLE_VOICE; do
            export "${name}_SV=$VOICE" "${name}_DE=$VOICE" "${name}_ES=$VOICE"
          done
          export PIPER_SV_MODEL="$VOICE" PIPER_DE_MODEL="$VOICE" PIPER_ES_MODEL="$VOICE"
          node scripts/generate-audio.mjs --locale "$LOCALE" --engine "$PROVIDER" | tail -3

      - name: Commit
        if: steps.missing.outputs.count != '0'
        env:
          LOCALE: ${{ matrix.locale }}
          VOICE: ${{ steps.missing.outputs.voice }}
          COUNT: ${{ steps.missing.outputs.count }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/audio
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Record $COUNT new $LOCALE line(s) in $VOICE" \
            -m "Generated by .github/workflows/record-new-audio.yml."
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
